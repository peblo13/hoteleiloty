<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opinia - HoteleILoty.pl - Podziel Się Opinią</title>
    <meta name="description" content="Formularz opinii. Pomóż nam ulepszyć HoteleILoty.pl dzieląc swoją opinią i uwagami.">
    <link rel="canonical" href="https://hoteleiloty.pl/feedback.html">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #0070f3; --secondary: #00d4ff; --accent: #ffa500; --dark-bg: #0a0e27; --text: #ffffff; --text-secondary: rgba(255, 255, 255, 0.7); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .animated-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background: radial-gradient(ellipse at center, #0a0e27 0%, #050815 100%); }
        .animated-bg::before { content: ''; position: absolute; width: 300%; height: 300%; top: -100%; left: -100%; background: radial-gradient(circle at 15% 25%, rgba(0, 112, 243, 0.15) 0%, transparent 60%), radial-gradient(circle at 85% 75%, rgba(0, 212, 255, 0.12) 0%, transparent 60%); animation: aurora 25s ease-in-out infinite; }
        @keyframes aurora { 0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); } 50% { transform: translate(-60%, -40%) rotate(180deg) scale(0.9); } }
        header { background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-bottom: 2px solid rgba(0, 112, 243, 0.3); padding: 1rem 2rem; position: sticky; top: 0; z-index: 1000; }
        .header-container { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 2rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
        nav { display: flex; gap: 2rem; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: all 0.3s; }
        nav a:hover { color: var(--secondary); }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }
        .hero { text-align: center; padding: 4rem 2rem; margin-bottom: 4rem; }
        .hero h1 { font-size: clamp(2.5rem, 5vw, 4rem); margin-bottom: 1rem; background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 900; }
        .form-section { background: linear-gradient(135deg, rgba(0, 112, 243, 0.1), rgba(0, 212, 255, 0.05)); border: 2px solid rgba(0, 112, 243, 0.2); border-radius: 20px; padding: 3rem; margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto; }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(0, 112, 243, 0.2); border-radius: 8px; padding: 0.75rem; color: var(--text); font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--secondary); background: rgba(0, 212, 255, 0.05); }
        .submit-btn { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; padding: 1rem 2rem; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem; transition: all 0.3s; width: 100%; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 112, 243, 0.4); }
        footer { background: rgba(10, 14, 39, 0.95); border-top: 2px solid rgba(0, 112, 243, 0.3); padding: 3rem 2rem; color: var(--text-secondary); }
        .footer-content { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 2rem; margin-bottom: 2rem; text-align: left; }
        .footer-section h3 { color: var(--text); margin-bottom: 1rem; }
        .footer-section ul { list-style: none; }
        .footer-section a { color: var(--text-secondary); text-decoration: none; transition: all 0.3s; display: block; margin-bottom: 0.5rem; }
        .footer-section a:hover { color: var(--secondary); }
    </style>
</head>
<body>
    <div class="animated-bg"></div>
    <header>
        <div class="header-container">
            <a href="index.html" class="logo">✈️ HoteleILoty</a>
            <nav>
                <a href="index.html">Strona główna</a>
                <a href="about.html">O nas</a>
                <a href="blog.html">Blog</a>
                <a href="kontakt.html">Kontakt</a>
                <a href="help.html">Pomoc</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1>Podziel Się Opinią</h1>
            <p>Twoja opinia jest dla nas ważna. Pomóż nam ulepszyć HoteleILoty.pl!</p>
        </div>

        <div class="form-section">
            <form onsubmit="handleSubmit(event)">
                <div class="form-group">
                    <label for="name">Imię i Nazwisko *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="category">Kategoria *</label>
                    <select id="category" name="category" required>
                        <option value="">Wybierz kategorię</option>
                        <option value="feature">Nowa funkcja</option>
                        <option value="bug">Błąd/Problem</option>
                        <option value="suggestion">Sugestia</option>
                        <option value="other">Inne</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Twoja Opinia *</label>
                    <textarea id="message" name="message" required placeholder="Napisz tutaj swoją opinię..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Wyślij Opinię</button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-section"><h3>Wsparcie</h3><ul><li><a href="feedback.html">Opinia</a></li><li><a href="kontakt.html">Kontakt</a></li></ul></div>
        </div>
        <div style="border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 2rem; text-align: center;">
            <p>&copy; 2025 HoteleILoty.pl</p>
        </div>
    </footer>

    <script>
        function handleSubmit(event) {
            event.preventDefault();
            alert('Dziękujemy za opinię! Wkrótce się skontaktujemy.');
            event.target.reset();
        }
    </script>
</body>
</html>
